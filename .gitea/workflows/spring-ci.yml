name: Spring Boot CI (Gitea Local)
on: [push]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar o código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven' # Guarda as dependências para acelerar futuros builds

      - name: 🏗️ Compilar e Testar a API
        run: ./mvnw -B clean test
