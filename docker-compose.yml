services:
  api-matriculas:
    container_name: api-matriculas-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    network_mode: "host"
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    environment:
      - TZ=America/Sao_Paulo
      # Console H2: evita resolver o hostname da maquina dentro do container (network_mode host)
      - JAVA_TOOL_OPTIONS=-Dh2.bindAddress=127.0.0.1
    command: ./mvnw spring-boot:run
