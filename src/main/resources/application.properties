springdoc.swagger-ui.path=/

# Persistencia (SDR-010): H2 em memoria com JPA
spring.datasource.url=jdbc:h2:mem:matriculas;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true


# Erros (SDR-017): nunca expor stack trace, mensagens internas ou erros de binding no corpo (o devtools os liga por padrao)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Numeros decimais em campos inteiros (ex: idade 20.7) sao rejeitados em vez de truncados
spring.jackson.deserialization.accept-float-as-int=false

# E-mail de confirmacao de matricula via Resend (SDR-019). Sem RESEND_API_KEY o envio fica desligado.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Matriculas <onboarding@resend.dev>}
resend.destino-fixo=${RESEND_DESTINO_FIXO:}
